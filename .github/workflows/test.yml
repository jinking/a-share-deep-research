name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── 闸门 1/3：单元 + 回归测试 ───────────────────────────────────────
      - name: Gate 1 — unit / regression tests
        run: pytest -q

      # ── 闸门 2/3：存量 v2 样板回归（行为零变化） ────────────────────────
      # v2 manifest 走兼容模式：只做引用完整性，不执行证据真实性校验。
      # 它的作用是保证「新模型没有把老产物改坏」。
      - name: Gate 2 — 存量样板回归（v2 manifest 必须仍然 PASS）
        run: |
          python scripts/validate_report.py \
            "examples/意华股份002897_深度研究_20260915_090532.html" \
            --manifest "examples/意华股份002897_样板/research_manifest.json" \
            --out /tmp/validation-v2

      # ── 闸门 3/3：v3 严格验收（P0、P1、P2 都必须为 0） ──────────────────
      # v3.0.1 起 Golden Sample 已是「严格 PASS」样本：23 条 EvidenceLink 全部
      # 绑定官方原件（3 份巨潮 PDF 带 SHA256 + 4 份本地取数），每条 critical
      # Claim 都有 locator 与原文摘录。
      #
      # 为什么证据层连 P2 也要阻断（报告层仍按 P0/P1）：
      #   按项目既定口径，「文件在但摘要不符」= P0 EVIDENCE_HASH_MISMATCH，
      #   而「登记了 hash 但原件没随仓库提交」= P2 EVIDENCE_HASH_UNVERIFIED。
      #   两者刻意分开，不能混改等级。但只挡 P0/P1 时，删掉一个原件只会产生
      #   P2 而构建照过——正是「证据原件漏提交」这类事故。此处把 P2 纳入阻断，
      #   既不改口径，又能守住「已登记的原件必须真实存在且未被替换」。
      #
      # 时间模型从 manifest 读出后透传给独立验收器，避免 CI 里出现第二份
      # as_of / market_data_as_of / generated_at 而与 manifest 漂移。
      - name: Gate 3a — v3 Evidence Store 严格验收（P0=P1=P2=0）
        run: |
          python - <<'PY' > /tmp/evidence-args.sh
          import json

          meta = json.load(
              open("examples/意华股份002897_样板/research_manifest.v3.json", encoding="utf-8")
          )["meta"]
          for flag, key in (
              ("--as-of", "as_of"),
              ("--market-data-as-of", "market_data_as_of"),
              ("--generated-at", "generated_at"),
          ):
              value = meta.get(key)
              if not value:
                  raise SystemExit(f"::error::v3 manifest 缺少 meta.{key}，无法执行时效校验")
              print(f"{flag} {value}")
          PY
          # shellcheck disable=SC2046
          python scripts/validate_evidence.py "examples/意华股份002897_样板/evidence" \
            $(cat /tmp/evidence-args.sh) --fail-on P0,P1,P2 --out /tmp/evidence-v3

      - name: Gate 3b — 报告 + manifest + 证据库 三段串联严格验收
        run: |
          python scripts/validate_report.py \
            "examples/意华股份002897_深度研究_20260915_090532.html" \
            --manifest "examples/意华股份002897_样板/research_manifest.v3.json" \
            --evidence-dir "examples/意华股份002897_样板/evidence" \
            --out /tmp/validation-v3

          python - <<'PY'
          import json
          import sys

          payload = json.load(open("/tmp/validation-v3/validation_report.json", encoding="utf-8"))
          stats = payload["summary"]
          got = {k: stats.get(k, 0) for k in ("P0", "P1", "P2")}
          print("v3 严格验收:", got)
          if got["P0"] or got["P1"]:
              sys.exit(f"::error::v3 严格验收未通过：P0={got['P0']} P1={got['P1']}")
          claim = payload.get("claim_summary") or {}
          if claim.get("P0") or claim.get("P1"):
              sys.exit(
                  f"::error::跨产物一致性未通过：P0={claim.get('P0')} P1={claim.get('P1')}"
              )
          PY

      # ── 闸门 4/4：跨产物一致性（v3.0.2 §14） ───────────────────────────
      # 回答的是 v3.0.2 §22 那个唯一问题：
      #   当证据层已经把结论改掉以后，最终交付给人的报告还能不能保留旧结论？
      # 答案必须是「不能」——所以这一闸门由三部分组成：正样本必须过、
      # 负样本必须挂、故障注入必须真的被抓住。

      - name: Gate 4a — 跨产物一致性（报告 ↔ Claim Ledger ↔ evidence_refs）
        run: |
          python scripts/validate_report.py \
            "examples/意华股份002897_深度研究_20260915_090532.html" \
            --manifest "examples/意华股份002897_样板/research_manifest.v3.json" \
            --evidence-dir "examples/意华股份002897_样板/evidence" \
            --claim-only --out /tmp/claim-v3

      - name: Gate 4b — 负 Golden Sample 必须 FAIL（旧结论漂移一定会被抓住）
        run: |
          set +e
          python scripts/validate_report.py \
            "examples/invalid/意华股份002897_旧结论漂移样板/意华股份002897_深度研究_20260915_090532.html" \
            --manifest "examples/invalid/意华股份002897_旧结论漂移样板/research_manifest.v3.json" \
            --evidence-dir "examples/意华股份002897_样板/evidence" \
            --claim-only --out /tmp/claim-drift
          rc=$?
          set -e
          python - "$rc" <<'PY'
          import json
          import sys

          rc = int(sys.argv[1])
          payload = json.load(open("/tmp/claim-drift/validation_report.json", encoding="utf-8"))
          codes = {f["code"] for f in payload["findings"] if f["severity"] in {"P0", "P1"}}
          required = {
              "REPORT_UNCONFIRMED_AS_FACT",       # PE(TTM) / 一致预期被当成事实
              "REPORT_PENDING_CLAIM_ASSERTED",    # pending Claim 被写成确定性结论
              "REPORT_CLAIM_LEVEL_MISMATCH",      # 在研被当成普通事实
              "REPORT_CRITICAL_CLAIM_MISSING",    # critical Claim 没有落点
          }
          missing = sorted(required - codes)
          if rc == 0:
              sys.exit("::error::负 Golden Sample 竟然 PASS —— 跨产物闸门已失效")
          if missing:
              sys.exit(f"::error::负 Golden Sample 未命中预期错误码: {missing}")
          print(f"✅ 负样本按预期 FAIL（rc={rc}，命中 {len(required)} 类错误码）")
          PY

      - name: Gate 4c — 故障注入（Claim 降级后旧报告必须 FAIL）
        run: pytest tests/integration/test_report_drift.py -q
